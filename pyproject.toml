[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentfile-guard"
version = "0.2.0"
description = "CI-first linter for AI agent instruction files: secrets, prompt injection, hidden Unicode, and stale references."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agentfile-guard contributors" }]
keywords = ["agents", "linter", "security", "sarif", "ci", "agents-md", "claude-md"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
agentfile-guard = "agentfile_guard.cli:main"

[project.urls]
Homepage = "https://github.com/SufyanDeloveper/agentfile-guard"
Repository = "https://github.com/SufyanDeloveper/agentfile-guard"
Issues = "https://github.com/SufyanDeloveper/agentfile-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfile_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
